databases:
  - name: flexflow-postgres
    databaseName: flexflow
    user: flexflow_user
    plan: free

services:
  - type: web
    name: flexflow
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@flexflow.com
      - key: ADMIN_PASSWORD
        value: Admin@123456
      - key: DATABASE_URL
        fromDatabase:
          name: flexflow-postgres
          property: connectionString
