<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0A1628">
    <meta name="description" content="FlexFlow — Admin Portal">
    <title>FlexFlow — Admin</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: '#0A1628',
                        'ink-light': '#1a2d4a',
                        chalk: '#F0F4FF',
                        brand: { DEFAULT: '#2D5BFF', dark: '#1E43D6', light: '#5B7FFF', soft: '#EEF2FF' },
                        gold: '#F5A524',
                        'gold-soft': '#FFF8ED',
                        ok: '#10B981',
                        'ok-soft': '#ECFDF5',
                        bad: '#EF4444',
                        'bad-soft': '#FEF2F2',
                        warn: '#F59E0B',
                        'warn-soft': '#FFFBEB',
                    },
                    fontFamily: {
                        display: ['"Barlow Condensed"', 'sans-serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        };
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { background: #F0F4FF; color: #0A1628; -webkit-font-smoothing: antialiased; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .slide-up { animation: slideUp .35s cubic-bezier(.4,0,.2,1); }
        .fade-in { animation: fadeIn .25s ease-out; }
        .pop { animation: pop .28s cubic-bezier(.4,0,.2,1); }
        .spin { animation: spin .75s linear infinite; }

        .glass { background: rgba(255,255,255,.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glass-dark { background: rgba(10,22,40,.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }

        .bottom-nav { padding-bottom: env(safe-area-inset-bottom, 6px); }
        .progress-bar { transition: width .65s cubic-bezier(.4,0,.2,1); }
        .num { font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
        :focus-visible { outline: 2px solid #2D5BFF; outline-offset: 2px; border-radius: 4px; }
        .hover\:bg-white\/8:hover { background-color: rgba(255,255,255,.08); }
    </style>
</head>
<body class="font-sans min-h-screen">

    <!-- SPA Root -->
    <div id="app"></div>

    <!-- Modal Container -->
    <div id="modal"></div>

    <!-- Toast Container -->
    <div id="toast" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none w-full max-w-sm px-4 sm:px-0" role="status" aria-live="polite"></div>

    <!-- Admin Script -->
    <script src="/admin.js"></script>
</body>
</html>
